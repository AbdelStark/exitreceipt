[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doneproof"
version = "0.1.0"
description = "A reproducible open-weight experiment in agent task completion decisions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
model = ["gliner2[train]==2.0.0", "sentencepiece>=0.2,<1", "protobuf>=5,<7"]
dev = ["pytest>=8,<9", "ruff>=0.13,<1"]

[project.scripts]
doneproof = "doneproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doneproof"]

[tool.hatch.build.targets.wheel.force-include]
"data/cases.psv" = "doneproof/data/cases.psv"
"data/evidence.psv" = "doneproof/data/evidence.psv"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
