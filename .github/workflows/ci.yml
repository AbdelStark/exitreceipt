name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --locked --extra dev
      - run: uv run --extra dev pytest -q
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check src tests scripts
      - run: uv run exitreceipt check-data
      - run: uv run exitreceipt check-data --data data/v2-cases.psv --evidence data/v2-evidence.psv
      - run: node --check app.js
      - run: uv build
      - run: uv venv "$RUNNER_TEMP/exitreceipt-wheel-smoke"
      - run: uv pip install --python "$RUNNER_TEMP/exitreceipt-wheel-smoke/bin/python" dist/exitreceipt-0.2.0-py3-none-any.whl
      - run: |
          "$RUNNER_TEMP/exitreceipt-wheel-smoke/bin/exitreceipt" check-data
          "$RUNNER_TEMP/exitreceipt-wheel-smoke/bin/python" -c 'from importlib.resources import files; from exitreceipt.corpus import load_cases; assert len(load_cases(files("exitreceipt") / "data/v2-cases.psv")) == 1252'
